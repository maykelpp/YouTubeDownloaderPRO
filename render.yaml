services:
  - type: web
    name: youtube-downloader-pro
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/app.db
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        value: dcpiurl@gmail.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENABLE_KEEPALIVE
        value: "false"
      - key: KEEPALIVE_URL
        sync: false
      - key: KEEPALIVE_INTERVAL
        value: "30"
      - key: SESSION_COOKIE_SECURE
        value: "true"
