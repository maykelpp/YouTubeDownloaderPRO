{% extends "_layout.html" %}
{% block title %}Iniciar sesión - YouTube Downloader PRO{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<form method="POST" action="{{ url_for('auth.login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="email">Correo electrónico</label>
<input type="email" id="email" name="email" required value="{{ email or '' }}">

<label for="password">Contraseña</label>
<input type="password" id="password" name="password" required>

<button type="submit" class="btn">Continuar</button>
</form>

{% if show_resend %}
<form method="POST" action="{{ url_for('auth.resend_verification') }}" style="margin-top:10px">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input type="hidden" name="email" value="{{ email or '' }}">
<button type="submit" class="btn btn-secondary">Reenviar correo de verificación</button>
</form>
{% endif %}

<div class="links">¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></div>
{% endblock %}
