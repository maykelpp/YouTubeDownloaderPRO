{% extends "_layout.html" %}
{% block title %}Crear cuenta - YouTube Downloader PRO{% endblock %}
{% block content %}
<h1>Crear cuenta</h1>
<form method="POST" action="{{ url_for('auth.register') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="name">Nombre</label>
<input type="text" id="name" name="name" required value="{{ name or '' }}">

<label for="email">Correo electrónico</label>
<input type="email" id="email" name="email" required value="{{ email or '' }}">

<label for="password">Contraseña</label>
<input type="password" id="password" name="password" required minlength="8">

<label for="password_confirm">Confirmar contraseña</label>
<input type="password" id="password_confirm" name="password_confirm" required minlength="8">

<button type="submit" class="btn">Crear cuenta</button>
</form>
<div class="links">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></div>
{% endblock %}
