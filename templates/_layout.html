<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}YouTube Downloader PRO{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;padding:20px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 30% 50%,rgba(16,185,129,0.12),transparent 50%),radial-gradient(circle at 70% 50%,rgba(59,130,246,0.12),transparent 50%);z-index:0;pointer-events:none}
.card{background:rgba(30,30,30,0.95);backdrop-filter:blur(20px);border-radius:20px;padding:36px;max-width:440px;width:100%;border:1px solid rgba(255,255,255,0.1);position:relative;z-index:1;margin-top:40px}
.brand{text-align:center;font-weight:800;font-size:22px;margin-bottom:24px;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:22px;margin-bottom:20px;text-align:center}
label{display:block;font-size:13px;color:#aaa;margin-bottom:6px;margin-top:16px}
input,textarea,select{width:100%;padding:14px 16px;border:2px solid rgba(255,255,255,0.15);border-radius:12px;font-size:15px;background:rgba(10,10,10,0.8);color:#fff;outline:none;font-family:'Poppins',sans-serif;transition:all 0.3s}
input:focus,textarea:focus,select:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,0.2)}
textarea{resize:vertical;min-height:90px}
.btn{margin-top:24px;padding:14px 24px;border:none;border-radius:50px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;font-weight:700;cursor:pointer;font-size:15px;width:100%;font-family:'Poppins',sans-serif;box-shadow:0 4px 20px rgba(16,185,129,0.4)}
.btn:hover{transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,0.08);box-shadow:none;border:1px solid rgba(255,255,255,0.15)}
.links{text-align:center;margin-top:18px;font-size:13px;color:#aaa}
.links a{color:#10b981;text-decoration:none;font-weight:600}
.flash{padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:13px;font-weight:600}
.flash-success{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.4);color:#6ee7b7}
.flash-error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5}
.code-input{letter-spacing:10px;text-align:center;font-size:28px;font-weight:700}
.hint{font-size:12px;color:#888;margin-top:8px;text-align:center}
.back-home{position:relative;z-index:1;margin-top:20px}
.back-home a{color:#aaa;text-decoration:none;font-size:13px}
</style></head><body>

<div class="card">
<div class="brand">🎵 YouTube Downloader PRO</div>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="flash flash-{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
{% endfor %}
{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</div>
<div class="back-home"><a href="{{ url_for('index') }}">&larr; Volver al inicio</a></div>

</body></html>
